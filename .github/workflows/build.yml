name: Build Dylix IPA

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Tạo GitHub Release với file IPA'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Download & Verify Toolchain
        run: |
          python3 scripts/fetch_toolchain.py

      - name: Build Device IPA
        run: |
          python3 scripts/build.py --sdk-root LocalSDKs/iPhoneOS26.0.sdk

      - name: Locate Output IPA
        id: ipa
        run: |
          IPA_FILE=$(ls build/Dylix-*.ipa | head -n 1)
          if [ ! -f "$IPA_FILE" ]; then
            echo "::error::IPA file not found in build/"
            exit 1
          fi
          echo "Found IPA: $IPA_FILE"
          echo "path=$IPA_FILE" >> $GITHUB_OUTPUT
          echo "name=$(basename "$IPA_FILE")" >> $GITHUB_OUTPUT

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa.outputs.name }}
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.ipa.outputs.path }}
          name: Dylix ${{ steps.ipa.outputs.name }}
          tag_name: ${{ github.ref_name || 'v1.1.0-vi' }}
          draft: false
          prerelease: false
          generate_release_notes: true
